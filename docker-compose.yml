services:
  postgres:
    image: postgres:16-alpine
    container_name: mascotdex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mascotdex
      POSTGRES_PASSWORD: mascotdex
      POSTGRES_DB: mascotdex
    ports:
      - "5432:5432"
    volumes:
      - mascotdex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mascotdex -d mascotdex"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    container_name: mascotdex-postgres-test
    environment:
      POSTGRES_USER: mascotdex
      POSTGRES_PASSWORD: mascotdex
      POSTGRES_DB: mascotdex_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mascotdex -d mascotdex_test"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mascotdex_pgdata:
